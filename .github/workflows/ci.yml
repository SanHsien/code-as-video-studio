name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    # Windows runner 的 cp1252 終端印不出中文，能抓到只在 Windows 發生的編碼錯誤；不設 PYTHONUTF8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # audit_motion_storyboard 的像素測試要有 Pillow 才會實際執行，否則明確 skip，綠燈不代表測過。
      # 瀏覽器端到端測試（CODE_AS_VIDEO_BROWSER_TESTS=1）CI 不跑，需本機手動執行。
      - name: Install test dependencies
        run: python -m pip install pillow==12.3.0

      - name: Unit tests
        run: python -m unittest discover -s tests -v
