version: 2
# fleet-waiver: freshness -- 只用 Python 標準庫，沒有 pip／npm 依賴宣告可以比對下限；Playwright 為選用且不宣告
updates:
  # 沒有 pip manifest（只用 Python 標準庫；Playwright 為選用，未安裝時自動降級）；受管依賴只有 workflow 引用的 actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
